<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Техкарты</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#fbf6ee;--card:#fff;--ink:#2a1d17;--mute:#8a7768;--line:#eadfce;--acc:#c2385f;--ok:#4f8a3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1310;--card:#271b16;--ink:#f3e9dc;--mute:#a89685;--line:#3a2a22;--acc:#ff5c8a;--ok:#9bd06c}}
:root[data-theme="dark"]{--bg:#1b1310;--card:#271b16;--ink:#f3e9dc;--mute:#a89685;--line:#3a2a22;--acc:#ff5c8a;--ok:#9bd06c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
.w{max-width:520px;margin:0 auto;padding:14px 16px 96px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font:600 26px Georgia,"Times New Roman",serif;margin:0}
.lg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.lg button{border:0;background:none;color:var(--mute);font:600 13px/1 system-ui;padding:6px 10px;border-radius:999px;cursor:pointer}
.lg button.on{background:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer}
.bar{width:5px;align-self:stretch;border-radius:4px}
.card b{display:block}.card small,.mute{color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font:600 15px/1.2 system-ui;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.yield{border:1px solid var(--acc);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;margin:12px 0}
.yield strong{font:600 30px Georgia,serif;color:var(--acc)}
h2{font-size:15px;margin:18px 0 8px;color:var(--mute);font-weight:600}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
ol{padding-left:20px;margin:0}li{margin-bottom:8px}
.back{border:0;background:none;color:var(--acc);font:600 15px/1.2 system-ui;padding:0;margin-bottom:8px;cursor:pointer}
.prog{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 16px}
.prog i{display:block;height:100%;background:var(--ok);transition:width .25s}
.task{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:8px;cursor:pointer}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.task.d .box{background:var(--ok);border-color:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mute);font:600 15px/1.2 system-ui;padding:14px 0;cursor:pointer}
nav button.on{color:var(--acc)}
.foot{text-align:center;font-size:12px;color:var(--mute);margin-top:20px}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:10px}summary{cursor:pointer;padding:10px 0;font-weight:600}.yl{color:var(--mute);font-weight:400;font-size:14px}.row.pfrow{background:none;border:0;border-left:5px solid #e0902b;border-radius:4px;padding:10px 12px;margin:8px 0;cursor:pointer;font-weight:700}.pfrow .ar{font-size:22px;line-height:1}.hero{width:100%;max-height:340px;object-fit:cover;border-radius:14px;margin:10px 0 4px;display:block}.th{width:58px;height:58px;object-fit:cover;border-radius:10px;flex:none}select{font:600 17px system-ui;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}</style></head><body><div class="w"><header><h1 id="ttl"></h1><div class="lg" id="lg"></div></header><main id="app"></main><div class="foot" id="foot"></div></div><script>
// Адрес опубликованного Apps Script (Развернуть → Веб-приложение, ссылка на /exec).
const API_URL='https://script.google.com/macros/s/AKfycbxGuzFCJt9PMY5l4gzpdGF41la6KpMUBCgGdG1N7cPuMCBELb_JZUxCwKKUVl_8xKVFGw/exec';
const tg=window.Telegram&&window.Telegram.WebApp;
let R=[];
const LG=['ES','RU','EN'];let lg=1,view={t:'list'},prev={t:'list'},N=5,B=1;
const UI={rec:['Recetas','Техкарты','Recipes'],pf:['Semiacabados','Полуфабрикаты','Semi-finished'],parts:['preparaciones','заготовок','components'],por:['Cantidad de porciones','Количество порций','Number of portions'],back:['‹ Atrás','‹ Назад','‹ Back'],yl:['rendimiento','выход','yield'],pl:['para','на','for'],cap:['1 receta = hasta','1 раскладка = до','1 recipe = up to'],need:['necesario','нужно','needed'],bt:['Recetas','Раскладок','Recipes'],used:['Se usa en','Где используется','Used in'],pp:['porciones de una receta','порций из одной раскладки','portions from one recipe'],ppCake:['tartas de una receta','тортов из одной раскладки','cakes from one recipe'],porCake:['Cantidad de tartas','Количество тортов','Number of cakes'],porQty:['Cantidad','Количество','Quantity'],cake:['tarta','торт','cake'],met:['Método','Способ приготовления','Method'],al:['Alérgenos','Аллергены','Allergens'],
 load:['Cargando…','Загрузка…','Loading…'],noAcc:['Sin acceso','Нет доступа','No access'],noAccTxt:['Envíe este ID al administrador:','Передайте этот ID администратору:','Send this ID to the administrator:'],badAuth:['Abra la app desde el bot de Telegram','Откройте приложение из бота в Telegram','Open the app from the Telegram bot'],err:['Error de carga','Ошибка загрузки','Loading error'],retry:['Reintentar','Повторить','Retry'],empty:['No hay recetas','Рецептов пока нет','No recipes yet']};
const U={g:['g','г','g'],kg:['kg','кг','kg'],pcs:['uds','шт','pcs']};
const t=k=>UI[k][lg];
const isCake=x=>/^торт/i.test(String(x.u||'').trim());
const fa=(n,u)=>u==='шт'?+n.toFixed(1)+' '+U.pcs[lg]:n>=1000?+(n/1000).toFixed(2)+' '+U.kg[lg]:+(n<10?n.toFixed(1):Math.round(n))+' '+U.g[lg];
const go=v=>{prev=view;view=v;B=v.b||1;if(v.t==='rec'&&R[v.i])N=isCake(R[v.i])?1:5;r();scrollTo(0,0)};
const goBack=()=>{view=prev;prev={t:'list'};r();scrollTo(0,0)};
const opts=(m,sel)=>Array.from({length:m},(_,i)=>i+1).map(n=>`<option ${n===sel?'selected':''}>${n}</option>`).join('');
function calc(x,n){const need={},f={},byId=Object.fromEntries(x.comps.map(c=>[c.id,c]));
 for(let i=x.comps.length-1;i>=0;i--){const c=x.comps[i];
  f[c.id]=c.asm?n:c.cap?Math.ceil(n/c.cap):c.base?n/c.base:c.y?(need[c.id]||0)/c.y:0;
  for(const g of c.ings)if(g.ref&&g.a!=null&&byId[g.ref]&&!byId[g.ref].cap&&!byId[g.ref].base)need[g.ref]=(need[g.ref]||0)+g.a*f[c.id];}
 return{f,need}}
const rows=(c,k,x)=>c.ings.map(g=>{const q=g.ref&&x.comps.find(q=>q.id===g.ref);const pf=q&&['pf','sheet'].includes(q.kind);return `<div class="row${pf?' pfrow':''}" ${pf?`onclick="go({t:'pf',i:${R.indexOf(x)},id:'${g.ref}'})"`:''}><span>${g.n[lg]}${g.note&&lg==1?`<br><small class="mute">${g.note}</small>`:''}</span><b>${g.a==null?'—':fa(g.a*k,g.u)}${pf?' <span class="ar">›</span>':''}</b></div>`}).join('');
const steps=c=>c.steps.length?`<h2>${t('met')}</h2><ol>${c.steps.map(s=>`<li>${s[lg]}</li>`).join('')}</ol>`:'';
const img=(src,cls,alt)=>src?`<img class="${cls}" src="${src}" alt="${alt||''}" onerror="this.style.display='none'">`:'';
function langBar(){lgEl.innerHTML=LG.map((x,i)=>`<button class="${i===lg?'on':''}" onclick="setLg(${i})">${x}</button>`).join('')}
function setLg(i){lg=i;try{localStorage.setItem('tk_lang',String(i))}catch(e){}if(state==='ok')r();else langBar()}
function tgBack(){if(!tg||!tg.BackButton||!tg.initData)return;if(view.t==='list')tg.BackButton.hide();else tg.BackButton.show()}
function r(){
 document.documentElement.lang=['es','ru','en'][lg];
 langBar();tgBack();
 foot.textContent='';ttl.textContent=view.t==='list'?t('rec'):'';
 const back=`<button class="back" onclick="goBack()">${t('back')}</button>`;
 if(view.t==='list'){if(!R.length){app.innerHTML=`<div class="mute">${t('empty')}</div>`;return}
  app.innerHTML=R.map((x,i)=>`<div class="card" onclick="go({t:'rec',i:${i}})">${x.img?img(x.img,'th'):`<span class="bar" style="background:#2f9d8a"></span>`}<div><b>${x.n[lg]}</b><small>${x.c[lg]}</small></div></div>`).join('')+`<h2>${t('pf')}</h2>`+R.flatMap((x,i)=>x.comps.filter(c=>c.kind==='pf'||c.kind==='sheet').map(c=>`<div class="card" onclick="go({t:'pf',i:${i},id:'${c.id}'})"><span class="bar" style="background:#e0902b"></span><div><b>${c.n[lg]}</b><small>${x.n[lg]} · ${t('yl')} ${c.y?fa(c.y,'г'):c.cap+' '+U.pcs[lg]}</small></div></div>`)).join('');return}
 const x=R[view.i];
 if(!x){view={t:'list'};return r()}
 if(view.t==='pf'){const c=x.comps.find(q=>q.id===view.id);
  if(!c){view={t:'list'};return r()}
  const used=R.flatMap(y=>{const q=y.comps.find(z=>z.id===c.id);if(!q)return[];if(q.cap)return[`${y.n[lg]}: ≈ ${q.cap} ${t(isCake(y)?'ppCake':'pp')}`];const n1=calc(y,1).need[c.id];return n1&&c.y?[`${y.n[lg]}: ≈ ${Math.floor(c.y/n1)} ${t(isCake(y)?'ppCake':'pp')}`]:[]});
  app.innerHTML=`${back}<h1>${c.n[lg]}</h1><div class="mute">${x.n[lg]}</div><div class="yield"><span>${t('bt')} · ${t('yl')} ${c.y?fa(c.y*B,'г'):(c.cap||1)*B+' '+U.pcs[lg]}</span><select onchange="B=+this.value;r()">${opts(Math.max(10,B),B)}</select></div>${rows(c,B,x)}${steps(c)}${c.yn&&lg==1?`<div class="mute" style="padding:8px 0">${c.yn}</div>`:''}${used.length?`<h2>${t('used')}</h2>${used.map(u=>`<div class="mute">${u}</div>`).join('')}`:''}`;return}
 const {f,need}=calc(x,N);
 const top=c=>x.comps.some(q=>q.kind!=='pf'&&q.ings.some(g=>g.ref===c.id));
 app.innerHTML=`${back}<h1>${x.n[lg]}</h1><div class="mute">${x.c[lg]}</div>${img(x.img,'hero',x.n[lg])}<div class="yield"><span>${t(isCake(x)?'porCake':'porQty')}</span><select onchange="N=+this.value;r()">${opts(60,N)}</select></div>`+
 x.comps.map(c=>{const k=c.asm?1:f[c.id];
  if(c.kind==='pf'||c.kind==='sheet'){if(c.kind==='pf'&&!top(c))return '';const sm=c.cap?`${t('need')}: ${k} × ${c.cap} ${U.pcs[lg]}`:`${t('need')} ${fa(need[c.id]||0,'г')}`;return `<div class="card" onclick="go({t:'pf',i:${view.i},id:'${c.id}',b:${c.cap?k:1}})"><span class="bar" style="background:#e0902b"></span><div><b>${c.n[lg]}</b><small>${sm} ›</small></div></div>`}
  const sub=c.asm?t('pl')+' 1 '+(isCake(x)?t('cake'):U.pcs[lg]):c.cap?'× '+k:c.y?t('yl')+' '+fa(c.y*k,'г'):t('pl')+' '+N+' '+U.pcs[lg];
  return `<details open><summary>${c.n[lg]} <span class="yl">· ${sub}</span></summary>${c.cap?`<div class="mute" style="font-size:13px">${t('cap')} ${c.cap} ${U.pcs[lg]}</div>`:''}${rows(c,k,x)}${steps(c)}${c.yn&&lg==1&&!c.asm?`<div class="mute" style="padding:8px 0">${c.yn}</div>`:''}</details>`}).join('')+`<h2>${t('al')}</h2><div class="mute">${x.al||'—'}</div>`;
}
const ttl=document.getElementById('ttl'),lgEl=document.getElementById('lg'),app=document.getElementById('app'),foot=document.getElementById('foot');

/* Загрузка рецептов из Google Таблицы через Apps Script */
let state='load';
function msg(title,text){state='msg';ttl.textContent='';langBar();app.innerHTML=`<div style="text-align:center;padding:60px 10px"><b style="font-size:19px">${title}</b><div class="mute" style="margin-top:8px">${text||''}</div></div>`}
function show(data){R=data||[];state='ok';r()}
function load(){
 let cached=null;try{cached=JSON.parse(localStorage.getItem('tk_data')||'null')}catch(e){}
 if(cached)show(cached);else msg(t('load'));
 fetch(API_URL+'?initData='+encodeURIComponent((tg&&tg.initData)||''))
  .then(res=>res.json())
  .then(res=>{
   if(res.ok){try{localStorage.setItem('tk_data',JSON.stringify(res.data))}catch(e){}
    const same=cached&&JSON.stringify(cached)===JSON.stringify(res.data);if(!same)show(res.data);return}
   try{localStorage.removeItem('tk_data')}catch(e){}
   R=[];view={t:'list'};
   if(res.error==='no_access')msg(t('noAcc'),`${t('noAccTxt')}<div style="font-size:26px;font-weight:700;margin-top:10px;user-select:all;color:var(--ink)">${res.id}</div>`);
   else if(res.error==='bad_auth')msg(t('badAuth'));
   else msg(t('err'),res.message||res.error||'');
  })
  .catch(e=>{if(state!=='ok')msg(t('err'),`${e}<p><button class="chip" onclick="load()">${t('retry')}</button></p>`)});
}
(function(){
 let s=null;try{s=localStorage.getItem('tk_lang')}catch(e){}
 if(s!==null&&s!=='')lg=+s;
 else if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user){const c=(tg.initDataUnsafe.user.language_code||'').slice(0,2);lg=c==='es'||c==='ca'?0:c==='en'?2:1}
 if(tg){try{tg.ready();tg.expand();tg.BackButton.onClick(goBack)}catch(e){}}
 load();
})();
</script></body></html>
